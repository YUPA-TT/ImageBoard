name: Build iOS Keyboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare image resources
        run: |
          chmod +x Tools/prepare_assets.sh
          ./Tools/prepare_assets.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodegen version

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ImageBoard.xcodeproj \
            -scheme ImageBoard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | xcpretty

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact/Payload
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/ImageBoard.app' -print -quit)
          test -n "$APP"
          cp -R "$APP" artifact/Payload/ImageBoard.app
          cd artifact
          zip -qry ../ImageBoard-unsigned.ipa Payload
          cd ..
          ls -lh ImageBoard-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageBoard-unsigned-ipa
          path: ImageBoard-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
