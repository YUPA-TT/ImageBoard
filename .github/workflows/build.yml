name: Build iOS Keyboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_PROVISIONING_PROFILE != '' && secrets.APPLE_TEAM_ID != '' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare image resources
        run: |
          chmod +x Tools/prepare_assets.sh
          ./Tools/prepare_assets.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodegen version

      - name: Build unsigned iOS app
        if: ${{ env.HAS_APPLE_SIGNING != 'true' }}
        run: |
          xcodebuild -project ImageBoard.xcodeproj -scheme ImageBoard -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build

      - name: Install Apple signing assets
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERT="$RUNNER_TEMP/signing.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERT"
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"
          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          security import "$CERT" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PROFILE" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Build signed iOS app
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          xcodebuild -project ImageBoard.xcodeproj -scheme ImageBoard -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="$IDENTITY" CODE_SIGN_STYLE=Manual clean build

      - name: Validate built bundle before packaging
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/ImageBoard.app' -print -quit)
          test -n "$APP"
          test -f "$APP/ImageBoard"
          test -f "$APP/Info.plist"
          test -d "$APP/PlugIns/ImageBoardKeyboard.appex"
          test -f "$APP/PlugIns/ImageBoardKeyboard.appex/ImageBoardKeyboard"
          test -f "$APP/PlugIns/ImageBoardKeyboard.appex/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" | grep -Fx 'ImageBoard'
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$APP/Info.plist" | grep -Fx 'APPL'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/PlugIns/ImageBoardKeyboard.appex/Info.plist" | grep -Fx 'ImageBoardKeyboard'
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$APP/PlugIns/ImageBoardKeyboard.appex/Info.plist" | grep -Fx 'XPC!'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP/PlugIns/ImageBoardKeyboard.appex/Info.plist" | grep -Fx 'com.apple.keyboard-service'
          plutil -lint "$APP/Info.plist"
          plutil -lint "$APP/PlugIns/ImageBoardKeyboard.appex/Info.plist"
          echo "Built app: $APP"
          du -sh "$APP"

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf artifact ImageBoard.ipa
          mkdir -p artifact/Payload
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/ImageBoard.app' -print -quit)
          test -n "$APP"
          ditto "$APP" artifact/Payload/ImageBoard.app
          cd artifact
          # IMPORTANT: the IPA root must contain Payload/, not ImageBoard.app/.
          zip -qry ../ImageBoard.ipa Payload
          cd ..
          unzip -t ImageBoard.ipa
          test "$(unzip -Z1 ImageBoard.ipa | grep -c '^Payload/$')" -eq 1
          test "$(unzip -Z1 ImageBoard.ipa | grep -c '^Payload/ImageBoard.app/$')" -eq 1
          test "$(unzip -Z1 ImageBoard.ipa | grep -c '^Payload/ImageBoard.app/PlugIns/ImageBoardKeyboard.appex/')" -gt 0
          # Reject the common broken form where Payload was omitted.
          test "$(unzip -Z1 ImageBoard.ipa | grep -c '^ImageBoard.app/')" -eq 0
          ls -lh ImageBoard.ipa

      - name: Verify packaged IPA
        run: |
          set -euo pipefail
          rm -rf ipa-check
          mkdir ipa-check
          unzip -q ImageBoard.ipa -d ipa-check
          APP=ipa-check/Payload/ImageBoard.app
          test -f "$APP/ImageBoard"
          test -f "$APP/Info.plist"
          test -f "$APP/PkgInfo"
          test -f "$APP/PlugIns/ImageBoardKeyboard.appex/ImageBoardKeyboard"
          test -f "$APP/PlugIns/ImageBoardKeyboard.appex/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" | grep -Fx 'ImageBoard'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'com.yupa.imageboard'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/PlugIns/ImageBoardKeyboard.appex/Info.plist" | grep -Fx 'ImageBoardKeyboard'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/PlugIns/ImageBoardKeyboard.appex/Info.plist" | grep -Fx 'com.yupa.imageboard.keyboard'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP/PlugIns/ImageBoardKeyboard.appex/Info.plist" | grep -Fx 'com.apple.keyboard-service'
          file "$APP/ImageBoard" | grep -E 'Mach-O.*arm64'
          file "$APP/PlugIns/ImageBoardKeyboard.appex/ImageBoardKeyboard" | grep -E 'Mach-O.*arm64'
          echo 'IPA bundle structure verified: Payload/ImageBoard.app/...'

      - name: Verify code signatures when signed
        if: ${{ env.HAS_APPLE_SIGNING == 'true' }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 ipa-check/Payload/ImageBoard.app
          codesign -dv --verbose=4 ipa-check/Payload/ImageBoard.app 2>&1 | grep -E 'Identifier|TeamIdentifier|Authority'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageBoard-ipa
          path: ImageBoard.ipa
          if-no-files-found: error
          retention-days: 14
