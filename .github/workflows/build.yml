name: Build iOS Keyboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare image resources
        run: |
          chmod +x Tools/prepare_assets.sh
          ./Tools/prepare_assets.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodegen version

      # The unsigned build is useful for TrollStore/jailbroken workflows.
      # A normal iOS installation requires Apple code signing; the signed
      # path below is enabled automatically when the required secrets exist.
      - name: Build unsigned iOS app
        if: ${{ secrets.APPLE_CERTIFICATE_P12 == '' || secrets.APPLE_PROVISIONING_PROFILE == '' }}
        run: |
          xcodebuild \
            -project ImageBoard.xcodeproj \
            -scheme ImageBoard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Install Apple signing assets
        if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_PROVISIONING_PROFILE != '' }}
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          CERT="$RUNNER_TEMP/signing.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERT"
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"

          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          security import "$CERT" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE")")
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Build signed iOS app
        if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_PROVISIONING_PROFILE != '' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ImageBoard.xcodeproj \
            -scheme ImageBoard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            clean build

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact/Payload
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/ImageBoard.app' -print -quit)
          test -n "$APP"
          test -d "$APP/PlugIns/ImageBoardKeyboard.appex"
          cp -R "$APP" artifact/Payload/ImageBoard.app
          cd artifact
          zip -qry ../ImageBoard.ipa Payload
          cd ..
          ls -lh ImageBoard.ipa

      - name: Verify bundle structure
        run: |
          set -euo pipefail
          unzip -l ImageBoard.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' artifact/Payload/ImageBoard.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' artifact/Payload/ImageBoard.app/PlugIns/ImageBoardKeyboard.appex/Info.plist
          test -f artifact/Payload/ImageBoard.app/ImageBoard
          test -f artifact/Payload/ImageBoard.app/PlugIns/ImageBoardKeyboard.appex/ImageBoardKeyboard

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageBoard-ipa
          path: ImageBoard.ipa
          if-no-files-found: error
          retention-days: 14
